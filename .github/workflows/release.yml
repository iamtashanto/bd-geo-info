name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (alpha, beta, rc or latest)"
        required: true
        default: "latest"
        type: choice
        options: [alpha, beta, rc, latest]
      dry_run:
        description: "Dry run (npm publish --dry-run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # GitHub Release
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/tgz"
          npm pack --pack-destination "$RUNNER_TEMP/tgz"
          ls -la "$RUNNER_TEMP/tgz"

      - name: Publish with provenance
        run: |
          flags="--access public --provenance --tag ${{ inputs.tag }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          for t in "$RUNNER_TEMP"/tgz/*.tgz; do
            echo "Publishing $t"
            npm publish "$t" $flags
          done

      - name: GitHub Release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          pre=""; if [ "${{ inputs.tag }}" != "latest" ]; then pre="--prerelease"; fi
          gh release create "v$v" --title "v$v" --generate-notes $pre || echo "Release already exists or skipped"
