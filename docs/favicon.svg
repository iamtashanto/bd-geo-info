<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bdg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006a4e"/>
      <stop offset="100%" stop-color="#004d38"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f42a41" flood-opacity="0.4"/>
